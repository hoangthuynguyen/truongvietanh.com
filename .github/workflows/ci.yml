name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=verbose

      - name: Astro build (v2 fallback mode — no live CMS)
        run: npm run build
        env:
          DIRECTUS_URL: https://cms.truongvietanh.com
          DIRECTUS_READ_TOKEN: placeholder

      - name: Verify v2 demo page built
        run: |
          test -f dist/v2/demo/index.html || (echo "v2 demo missing" && exit 1)
          grep -q "b-hero-squeeze" dist/v2/demo/index.html || (echo "v2 blocks not rendered" && exit 1)
          echo "✓ /v2/demo rendered with blocks"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7

  legacy-audit:
    name: Legacy pages audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run audit
        run: node scripts/legacy-to-v2.mjs
      - name: Comment audit summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('reports/legacy-pages-audit.csv', 'utf8');
            const total = csv.split('\n').length - 2; // minus header + trailing newline
            const body = `## Legacy pages audit\n\n${total} pages tracked in \`reports/legacy-pages-audit.csv\`.\n\nAfter v2 migration these collapse to 1 dispatcher + ${total} CMS records.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('## Legacy pages audit'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
