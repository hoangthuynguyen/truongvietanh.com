name: Deploy to Production (truongvietanh.com)

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cms_content_updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers (truongvietanh.com)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_DIRECTUS_URL: ${{ secrets.PUBLIC_DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}

      - name: Deploy to Cloudflare Workers (1st try)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.jsonc

      - name: Wait for edge propagation
        run: sleep 25

      - name: Smoke test (1st)
        id: smoke1
        continue-on-error: true
        run: bash scripts/smoke-test.sh

      # Re-deploy nếu smoke test 1 fail (Cloudflare Workers ASSETS đôi khi
      # bị stale dù wrangler báo upload thành công — re-deploy heal được)
      - name: Re-deploy to heal stale assets
        if: steps.smoke1.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.jsonc

      - name: Wait after heal
        if: steps.smoke1.outcome == 'failure'
        run: sleep 30

      - name: Smoke test (2nd, sau khi heal)
        if: steps.smoke1.outcome == 'failure'
        run: bash scripts/smoke-test.sh
